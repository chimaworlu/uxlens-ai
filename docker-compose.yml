services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uxlens_ai
    ports:
      # Host port 5432 is already taken by an unrelated project's Postgres
      # container on this machine — mapped to 5433 on the host instead to
      # avoid touching that container. DATABASE_URL below matches.
      - "5433:5432"
    volumes:
      - uxlens_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  uxlens_postgres_data:
